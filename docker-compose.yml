version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lavender
      POSTGRES_PASSWORD: lavender
      POSTGRES_DB: lavenderhealth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_test:
    image: postgres:16
    environment:
      POSTGRES_USER: lavender
      POSTGRES_PASSWORD: lavender
      POSTGRES_DB: lavenderhealth_test
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
